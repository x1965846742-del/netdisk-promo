<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>打开网盘分享</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --text: #1d1d1f;
            --sub: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: #e5e5ea;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --card: #2c2c2e;
                --text: #f5f5f7;
                --sub: #98989d;
                --accent: #0a84ff;
                --accent-hover: #409cff;
                --border: #38383a;
                --shadow: 0 2px 12px rgba(0,0,0,0.4);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        /* 图标区 */
        .icon-wrap {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            background: var(--card);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .icon-wrap svg {
            width: 36px;
            height: 36px;
            color: var(--accent);
        }

        /* 标题 */
        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .subtitle {
            font-size: 14px;
            color: var(--sub);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        /* 按钮 */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(0,113,227,0.3);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:active { background: var(--bg); }
        .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

        /* 二维码 */
        .qr-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .qr-label {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 12px;
        }
        .qr-img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            background: #fff;
            padding: 8px;
            box-shadow: var(--shadow);
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0,0,0,0.82);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* 步骤引导 */
        .steps {
            margin-top: 16px;
            text-align: left;
            padding: 16px 20px;
            background: var(--card);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }
        .steps ol {
            padding-left: 20px;
            font-size: 13px;
            color: var(--sub);
            line-height: 2;
        }
        .step-hint {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- 动态渲染内容 -->
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
    'use strict';

    // ===== 1. 解析目标链接 =====
    function getTargetUrl() {
        // 支持 ?target=<完整URL> 和 ?id=<分享ID> 两种参数
        var params = new URLSearchParams(location.search);
        var target = params.get('target');
        if (target) {
            try {
                return decodeURIComponent(target);
            } catch(e) {
                return target;
            }
        }
        var id = params.get('id');
        if (id && /^[a-zA-Z0-9_-]+$/.test(id)) {
            return 'https://yun.139.com/shareweb/#/w/i/' + id;
        }
        // 路径模式: /jump/XXX
        var m = location.pathname.match(/\/jump\/([a-zA-Z0-9_-]+)$/);
        if (m) {
            return 'https://yun.139.com/shareweb/#/w/i/' + m[1];
        }
        return null;
    }

    var targetUrl = getTargetUrl();

    // ===== 2. UA 检测 =====
    var ua = navigator.userAgent || '';
    var isXunlei = /xunlei|thunder|xlBrowser|XLBrowser/i.test(ua);
    var isAndroid = /android/i.test(ua);
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    // ===== 3. Toast 工具 =====
    var toastTimer;
    function showToast(msg) {
        var el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
            el.classList.remove('show');
        }, 1800);
    }

    // ===== 4. 复制到剪贴板 =====
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text).then(function() {
                showToast('链接已复制，请在自带浏览器中粘贴打开');
            }).catch(function() {
                fallbackCopy(text);
            });
        }
        fallbackCopy(text);
    }

    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
            document.execCommand('copy');
            showToast('链接已复制，请在自带浏览器中粘贴打开');
        } catch(e) {
            showToast('请长按下方链接手动复制');
        }
        document.body.removeChild(ta);
    }

    // ===== 5. 渲染迅雷浏览器的引导页 =====
    function renderBlockedUI() {
        // 生成二维码
        var qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=000&margin=10&data='
            + encodeURIComponent(targetUrl);

        var html = '';
        html += '<div class="icon-wrap">';
        html +=   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
        html +=     '<circle cx="12" cy="12" r="10"/>';
        html +=     '<path d="M12 16v-4"/>';
        html +=     '<path d="M12 8h.01"/>';
        html +=   '</svg>';
        html += '</div>';

        html += '<h1 class="title">该链接无法在当前浏览器打开</h1>';
        html += '<p class="subtitle">迅雷浏览器屏蔽了此网盘链接<br>请使用手机自带浏览器打开</p>';

        // 按钮区
        html += '<button class="btn btn-primary" id="btn-copy">';
        html +=   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
        html +=     '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>';
        html +=     '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
        html +=   '</svg>';
        html +=   '复制链接并在自带浏览器打开';
        html += '</button>';

        if (isAndroid) {
            html += '<button class="btn btn-secondary" id="btn-intent">';
            html +=   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
            html +=     '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>';
            html +=     '<polyline points="15 3 21 3 21 9"/>';
            html +=     '<line x1="10" y1="14" x2="21" y2="3"/>';
            html +=   '</svg>';
            html +=   '尝试直接跳转到系统浏览器';
            html += '</button>';
        }

        // 二维码
        html += '<div class="qr-section">';
        html +=   '<p class="qr-label">或使用相机 / 微信扫一扫打开</p>';
        html +=   '<img class="qr-img" src="' + qrSrc + '" alt="二维码" width="160" height="160" loading="eager" onerror="this.style.display=\'none\'">';
        html += '</div>';

        // 手动步骤
        html += '<div class="steps">';
        html +=   '<p class="step-hint">手动操作步骤</p>';
        html +=   '<ol>';
        html +=     '<li>点击上方蓝色按钮复制链接</li>';
        html +=     '<li>打开手机自带浏览器（如 Safari、Chrome、小米浏览器等）</li>';
        html +=     '<li>在地址栏粘贴并打开</li>';
        html +=   '</ol>';
        html += '</div>';

        document.getElementById('app').innerHTML = html;

        // 事件绑定
        document.getElementById('btn-copy').addEventListener('click', function() {
            copyToClipboard(targetUrl);
        });

        if (isAndroid) {
            document.getElementById('btn-intent').addEventListener('click', function() {
                tryOpenInSystemBrowser();
            });
        }
    }

    // ===== 6. Android: 尝试通过 intent:// 调起系统浏览器 =====
    function tryOpenInSystemBrowser() {
        // 直接复用当前页面 URL（已包含 ?id=XXX 参数），系统浏览器打开后会自动跳转到 139 网盘
        var selfUri = location.href.split('#')[0].replace(/^https?:\/\//, '');
        var intentUrl = 'intent://' + selfUri + '#Intent;scheme=https;end';

        try {
            window.location.href = intentUrl;
        } catch(e) {
            // 静默失败，用户可点击手动按钮
        }
    }

    // ===== 7. 找不到目标链接的错误页 =====
    function renderErrorUI() {
        var html = '';
        html += '<div class="icon-wrap">';
        html +=   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
        html +=     '<circle cx="12" cy="12" r="10"/>';
        html +=     '<line x1="12" y1="8" x2="12" y2="12"/>';
        html +=     '<line x1="12" y1="16" x2="12.01" y2="16"/>';
        html +=   '</svg>';
        html += '</div>';
        html += '<h1 class="title">缺少分享链接参数</h1>';
        html += '<p class="subtitle">请使用完整的分享链接访问此页面</p>';
        document.getElementById('app').innerHTML = html;
    }

    // ===== 8. 主逻辑 =====
    function init() {
        if (!targetUrl) {
            renderErrorUI();
            return;
        }

        if (!isXunlei) {
            // 非迅雷浏览器 — 直接跳转到目标链接
            window.location.replace(targetUrl);
            // 如果 replace 没生效（极少数情况），显示跳转中
            document.getElementById('app').innerHTML =
                '<div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>'
                + '<h1 class="title">正在打开...</h1>'
                + '<p class="subtitle">如未自动跳转，请<a href="' + targetUrl + '">点击此处</a></p>';
            return;
        }

        // 迅雷浏览器 — 展示引导页
        renderBlockedUI();

        // Android: 自动尝试 intent 跳转（静默）
        if (isAndroid) {
            setTimeout(function() {
                tryOpenInSystemBrowser();
            }, 300);
        }
    }

    init();
})();
</script>
</body>
</html>
